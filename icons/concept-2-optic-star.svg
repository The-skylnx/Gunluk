<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="optBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <filter id="starGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Squircle Kasa -->
  <rect width="512" height="512" rx="112" fill="url(#optBg)" />

  <!-- Optik Kodlama Izgarası (Hafif arka plan deseni) -->
  <g opacity="0.18">
    <circle cx="160" cy="150" r="18" fill="#FFFFFF" />
    <circle cx="224" cy="150" r="18" fill="#FFFFFF" />
    <circle cx="288" cy="150" r="18" fill="#FFFFFF" />
    <circle cx="352" cy="150" r="18" fill="#FFFFFF" />

    <circle cx="160" cy="214" r="18" fill="#FFFFFF" />
    <circle cx="224" cy="214" r="18" fill="#FFFFFF" />
    <circle cx="288" cy="214" r="18" fill="#FFFFFF" />
    <circle cx="352" cy="214" r="18" fill="#FFFFFF" />

    <circle cx="160" cy="278" r="18" fill="#FFFFFF" />
    <circle cx="224" cy="278" r="18" fill="#FFFFFF" />
    <circle cx="288" cy="278" r="18" fill="#FFFFFF" />
    <circle cx="352" cy="278" r="18" fill="#FFFFFF" />

    <circle cx="160" cy="342" r="18" fill="#FFFFFF" />
    <circle cx="224" cy="342" r="18" fill="#FFFFFF" />
    <circle cx="288" cy="342" r="18" fill="#FFFFFF" />
    <circle cx="352" cy="342" r="18" fill="#FFFFFF" />
  </g>

  <!-- Doldurulmuş Optik Baloncuk + Yükselen Kutup Yıldızı -->
  <circle cx="256" cy="256" r="105" fill="#1E40AF" stroke="#60A5FA" stroke-width="8" opacity="0.3" />
  <circle cx="256" cy="256" r="82" fill="#2563EB" />
  
  <!-- Başarı Yıldızı (Optikten Fırlayan Hedef) -->
  <path d="M256,120 Q256,256 120,256 Q256,256 256,392 Q256,256 392,256 Q256,256 256,120 Z" fill="url(#starGrad)" filter="url(#starGlow)" />
  <circle cx="256" cy="256" r="22" fill="#FFFFFF" />
</svg>
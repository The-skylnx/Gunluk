        if(!w||document.getElementById("sw-update-toast"))return;
        var b=document.createElement("button");
        b.id="sw-update-toast";
        b.textContent="Yeni sürüm var, yenile";
        b.style.cssText="position:fixed;right:16px;bottom:16px;z-index:9999;padding:10px 14px;border-radius:10px;border:1px solid #3b82f6;background:#111827;color:#f8fafc;font-weight:700;font-size:12.5px;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,0.45);";
        b.onclick=function(){w.postMessage({type:"SKIP_WAITING"});};
        document.body.appendChild(b);
      }
      if(reg.waiting)showUpdate(reg.waiting);
      reg.addEventListener("updatefound",function(){
        var nw=reg.installing;
        if(!nw)return;
        nw.addEventListener("statechange",function(){
          if(nw.state==="installed"&&navigator.serviceWorker.controller)showUpdate(nw);
        });
      });
    }).catch(function(){});
    var _ref=false;
    navigator.serviceWorker.addEventListener("controllerchange",function(){
      if(_ref)return;_ref=true;location.reload();
    });
  }
})();
</script>

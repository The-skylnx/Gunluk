    <!-- Sağ Vurgulu Turuncu G -->
    <path d="M160,30 C125,30 95,55 85,90 L125,90 C130,70 145,55 165,55 C190,55 210,75 210,100 C210,125 190,145 165,145 L135,145 L135,175 L165,175 C205,175 240,140 240,100 C240,60 205,30 160,30 Z" fill="url(#ggAccent)" />

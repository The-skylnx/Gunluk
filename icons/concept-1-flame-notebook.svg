<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141E30" />
      <stop offset="100%" stop-color="#243B55" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF4B4B" />
      <stop offset="50%" stop-color="#FF851B" />
      <stop offset="100%" stop-color="#FFDC00" />
    </linearGradient>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F2F4F7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Arka Plan / App Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Defter Kâğıt Gövdesi (Perspektifli / Temiz Köşeli) -->
  <g transform="translate(106, 120)">
    <!-- Gölge -->
    <rect x="8" y="16" width="284" height="280" rx="24" fill="#090E17" opacity="0.4" />
    <!-- Sayfa Yaprağı -->
    <rect x="0" y="0" width="284" height="280" rx="24" fill="url(#paperGrad)" />
    <!-- Kırmızı Marj Çizgisi -->
    <line x1="68" y1="0" x2="68" y2="280" stroke="#E5484D" stroke-width="4" stroke-dasharray="8 6" opacity="0.85" />
    <!-- Satır Çizgileri -->
    <line x1="84" y1="72" x2="252" y2="72" stroke="#D0D7DE" stroke-width="4" stroke-linecap="round" />
    <line x1="84" y1="124" x2="252" y2="124" stroke="#D0D7DE" stroke-width="4" stroke-linecap="round" />
    <line x1="84" y1="176" x2="252" y2="176" stroke="#D0D7DE" stroke-width="4" stroke-linecap="round" />
    <line x1="84" y1="228" x2="190" y2="228" stroke="#D0D7DE" stroke-width="4" stroke-linecap="round" />
  </g>
  
  <!-- Yükselen Duolingo-Esintili Seri Alevi -->
  <g transform="translate(256, 260)" filter="url(#glow)">
    <!-- Dış Ateş -->
    <path d="M0,80 C-75,80 -105,15 -80,-45 C-65,-80 -30,-125 0,-175 C30,-125 65,-80 80,-45 C105,15 75,80 0,80 Z" fill="url(#flameGrad)" />
    <!-- İç Parlak Çekirdek -->
    <path d="M0,70 C-40,70 -55,30 -42,-15 C-32,-45 -15,-75 0,-110 C15,-75 32,-45 42,-15 C55,30 40,70 0,70 Z" fill="#FFF275" opacity="0.95" />
  </g>
</svg>